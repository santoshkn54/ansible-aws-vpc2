---
- name: setup mysql with accounts db and remote login
  hosts: dbsrvgrp
  gather_facts: no
  tasks:
    - name: Install necessary packages for pip
      apt:
        name:
            - python3-pip
            - python2-pip
            - python3-dev
            - python2-dev
            - libmysqlclient-dev
        state: present
        ignore_errors: yes

    - name: Install pip for Python 2.x if not installed
      command: python2 /tmp/get-pip.py
      args:
        warn: false
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Download get-pip.py for Python 2.x
      get_url:
        url: https://bootstrap.pypa.io/pip/2.7/get-pip.py
        dest: /tmp/get-pip.py

    - name: Install MySQL client for Python 2.x
      pip:
        name: mysqlclient
        state: present
        executable: pip2

    - name: Install MySQL client for Python 3.x
      pip:
        name: PyMySQL
        state: present
        executable: pip3



    - name: creating mysql user
      mysql_user:
        name: "{{dbuser}}"
        password: "{{dbpass}}"
        priv: '*.*:ALL'
        host: '%'
        state: present
    - name: creating acounts db
      mysql_db:
        name: "{{dbname}}"
        state: present
    - name: Enable remote login to mysql svc
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
        backup: yes
      notify:
        - Restart mysql
      tags:
        - conf
  handlers:
   - name: Restart mysql
     service:
      name: mysql
      state: restarted