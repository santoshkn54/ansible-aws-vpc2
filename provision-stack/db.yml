---
- name: setup mysql with accounts db and remote login
  hosts: dbsrvgrp
  gather_facts: no
  tasks:
    - name: update apt repository
      apt:
        update_cache: yes
    - name: Install MySQL server
      apt:
        name: mysql-server
        state: present
    - name: installing python3
      apt:
        name: python3-mysqldb
        state: present

    - name: creating mysql user
      mysql_user:
        name: "{{dbuser}}"
        password: "{{dbpass}}"
        priv: '*.*:ALL'
        host: '%'
        state: present
    - name: creating acounts db
      mysql_db:
        name: "{{dbname}}"
        state: present
    - name: Enable remote login to mysql svc
      lineinfile:
        path: /etc/mysql/msql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
        backup: yes
      notify:
        - Restart mysql
      tags:
        - conf
  handlers:
   - name: Restart mysql
     service:
      name: mysql
      state: restarted