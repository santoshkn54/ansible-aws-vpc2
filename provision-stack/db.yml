---
- name: setup mysql with accounts db and remote login
  hosts: dbsrvgrp
  gather_facts: no
  tasks:
    - name: Installing Mysql Service and dependencies
      package:
          name: "{{item}}"
          state: present
          update_cache: yes
          cache_valid_time: 86400
      loop:
          - mysql-server
          - mysql-client
          - python-mysqldb
          - python3-mysqldb
          - libmysqlclient-dev
      ignore_errors: yes
      tags:
        - package
    - name: Install pip for Python 2.x if python2-pip is not found
      block:
        - name: Download get-pip.py for Python 2.x
          get_url:
            url: https://bootstrap.pypa.io/pip/2.7/get-pip.py
            dest: /tmp/get-pip.py

        - name: Install pip for Python 2.x
          command: python2 /tmp/get-pip.py




    - name: creating mysql user
      mysql_user:
        name: "{{dbuser}}"
        password: "{{dbpass}}"
        priv: '*.*:ALL'
        host: '%'
        state: present
    - name: creating acounts db
      mysql_db:
        name: "{{dbname}}"
        state: present
    - name: Enable remote login to mysql svc
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
        backup: yes
      notify:
        - Restart mysql
      tags:
        - conf
  handlers:
   - name: Restart mysql
     service:
      name: mysql
      state: restarted