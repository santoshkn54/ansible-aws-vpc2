---
- name: setup mysql with accounts db and remote login
  hosts: dbsrvgrp
  gather_facts: no
  tasks:
    - name: Installing Mysql Service and dependencies
      package:
          name: "{{item}}"
          state: present
          update_cache: yes
          cache_valid_time: 86400
      loop:
          - mysql-server
          - mysql-client
          - python-mysqldb
          - python3-mysqldb
          - libmysqlclient-dev
      ignore_errors: yes
      tags:
        - package
    - name: Install python3-mysqldb package
      apt:
        name: python3-mysqldb
        state: present
    - name: Install MySQL server
      apt:
        name: mysql-server
        state: present

    - name: Ensure MySQL is started and enabled
      service:
        name: mysql
        state: started
        enabled: yes



    - name: creating mysql user
      mysql_user:
        name: "{{dbuser}}"
        password: "{{dbpass}}"
        priv: '*.*:ALL'
        host: '%'
        state: present
    - name: creating acounts db
      mysql_db:
        name: "{{dbname}}"
        state: present
    - name: Enable remote login to mysql svc
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
        backup: yes
      notify:
        - Restart mysql
      tags:
        - conf
  handlers:
   - name: Restart mysql
     service:
      name: mysql
      state: restarted